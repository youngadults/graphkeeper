<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1080" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1680" height="1080" fill="#f8fafc"/>

  <text x="60" y="46" font-size="26" font-weight="700" fill="#0f172a">GraphKeeper — How a change actually flows</text>
  <text x="60" y="72" font-size="13" fill="#475569">Follow three real actions through the four layers · colors match the architecture map (docs/architecture.svg)</text>

  <!-- legend -->
  <g font-size="10.5">
    <rect x="350" y="82" width="250" height="26" rx="13" fill="#f1f5f9" stroke="#334155"/>
    <circle cx="366" cy="95" r="5" fill="#334155"/>
    <text x="378" y="99" fill="#334155">Browser — client (React)</text>
    <rect x="620" y="82" width="220" height="26" rx="13" fill="#eff6ff" stroke="#2563eb"/>
    <circle cx="636" cy="95" r="5" fill="#2563eb"/>
    <text x="648" y="99" fill="#334155">API — server (Next.js)</text>
    <rect x="860" y="82" width="200" height="26" rx="13" fill="#fffbeb" stroke="#d97706"/>
    <circle cx="876" cy="95" r="5" fill="#d97706"/>
    <text x="888" y="99" fill="#334155">Domain — pure rules</text>
    <rect x="1080" y="82" width="250" height="26" rx="13" fill="#ecfdf5" stroke="#059669"/>
    <circle cx="1096" cy="95" r="5" fill="#059669"/>
    <text x="1108" y="99" fill="#334155">Data — Drizzle → Postgres</text>
  </g>

  <!-- ================= COLUMN 1 ================= -->
  <rect x="40" y="130" width="508" height="860" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="160" font-size="15" font-weight="700" fill="#0f172a">① Create an edge</text>
  <text x="60" y="178" font-size="11" fill="#64748b">drag a connection between two nodes on the canvas</text>

  <line x1="66" y1="222" x2="66" y2="785" stroke="#cbd5e1" stroke-width="2"/>

  <circle cx="66" cy="222" r="13" fill="#334155"/><text x="66" y="226" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="92" y="180" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="106" y="201"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">You drag from node A to node B</tspan></text>
  <text x="106" y="221" font-size="10.5" fill="#475569">A new edge appears on the canvas, dashed —</text>
  <text x="106" y="237" font-size="10.5" fill="#475569">pending means untrusted until someone reviews it</text>

  <circle cx="66" cy="318" r="13" fill="#334155"/><text x="66" y="322" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="92" y="276" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="106" y="297"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">The app stamps who you are</tspan></text>
  <text x="106" y="317" font-size="10.5" fill="#475569">Every request carries your actor id (from the user</text>
  <text x="106" y="333" font-size="10.5" fill="#475569">picker) — the server trusts no one by default</text>

  <circle cx="66" cy="414" r="13" fill="#334155"/><text x="66" y="418" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="92" y="372" width="440" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="106" y="393"><tspan fill="#2563eb" font-size="9.5" font-weight="700">API · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">POST /api/edges — validation gate</tspan></text>
  <text x="106" y="413" font-size="10.5" fill="#475569">zod checks the body: valid ids? known type? sane props?</text>
  <text x="106" y="429" font-size="10.5" fill="#475569">Bad input → 422 — nothing ever reaches storage</text>

  <circle cx="66" cy="510" r="13" fill="#334155"/><text x="66" y="514" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="92" y="468" width="440" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="106" y="489"><tspan fill="#2563eb" font-size="9.5" font-weight="700">API · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Role check</tspan></text>
  <text x="106" y="509" font-size="10.5" fill="#475569">actor header → user lookup: viewer gets 403;</text>
  <text x="106" y="525" font-size="10.5" fill="#475569">analyst and admin continue</text>

  <circle cx="66" cy="606" r="13" fill="#334155"/><text x="66" y="610" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="92" y="564" width="440" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="106" y="585"><tspan fill="#d97706" font-size="9.5" font-weight="700">DOMAIN · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Birth rules for a new edge</tspan></text>
  <text x="106" y="605" font-size="10.5" fill="#475569">status = pending · origin = manual — the state</text>
  <text x="106" y="621" font-size="10.5" fill="#475569">machine decides what a new edge may look like</text>

  <circle cx="66" cy="702" r="13" fill="#334155"/><text x="66" y="706" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="92" y="660" width="440" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="106" y="681"><tspan fill="#059669" font-size="9.5" font-weight="700">DATA · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Two rows written</tspan></text>
  <text x="106" y="701" font-size="10.5" fill="#475569">INSERT into edges + INSERT into activity_log</text>
  <text x="106" y="717" font-size="10.5" fill="#475569">(actor, action 'create', the full after-state as JSON)</text>

  <circle cx="66" cy="798" r="13" fill="#334155"/><text x="66" y="802" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="92" y="756" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="106" y="777"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">201 back — it's real now</tspan></text>
  <text x="106" y="797" font-size="10.5" fill="#475569">A refresh keeps the edge: it lives in Postgres,</text>
  <text x="106" y="813" font-size="10.5" fill="#475569">not just on your screen</text>

  <rect x="60" y="858" width="468" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="76" y="884" font-size="11" font-weight="700" fill="#0f172a">→ Visible result</text>
  <text x="76" y="902" font-size="10.5" fill="#475569">dashed edge on canvas + a new entry in History —</text>
  <text x="76" y="918" font-size="10.5" fill="#475569">parked in the review queue, trusted by no one yet</text>

  <!-- ================= COLUMN 2 ================= -->
  <rect x="576" y="130" width="508" height="860" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="596" y="160" font-size="15" font-weight="700" fill="#0f172a">② Import a CSV</text>
  <text x="576" y="178" font-size="11" fill="#64748b">bulk relationships enter through the front door</text>

  <line x1="602" y1="222" x2="602" y2="689" stroke="#cbd5e1" stroke-width="2"/>

  <circle cx="602" cy="222" r="13" fill="#334155"/><text x="602" y="226" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="628" y="180" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="642" y="201"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Import wizard: drop your file</tspan></text>
  <text x="642" y="221" font-size="10.5" fill="#475569">upload a CSV, map its columns to node/edge</text>
  <text x="642" y="237" font-size="10.5" fill="#475569">fields — nothing has been sent yet</text>

  <circle cx="602" cy="318" r="13" fill="#334155"/><text x="602" y="322" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="628" y="276" width="440" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="642" y="297"><tspan fill="#2563eb" font-size="9.5" font-weight="700">API · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">POST /api/import/preview</tspan></text>
  <text x="642" y="317" font-size="10.5" fill="#475569">parser sanitizes formula cells (= + - @) and</text>
  <text x="642" y="333" font-size="10.5" fill="#475569">rejects duplicate headers with a 422</text>

  <circle cx="602" cy="414" r="13" fill="#334155"/><text x="602" y="418" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="628" y="372" width="440" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="642" y="393"><tspan fill="#d97706" font-size="9.5" font-weight="700">DOMAIN · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Preview built — nothing saved</tspan></text>
  <text x="642" y="413" font-size="10.5" fill="#475569">"these N nodes + M relationships will be created" —</text>
  <text x="642" y="429" font-size="10.5" fill="#475569">you eyeball it before anything is written</text>

  <circle cx="602" cy="510" r="13" fill="#334155"/><text x="602" y="514" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="628" y="468" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="642" y="489"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">You hit Commit</tspan></text>
  <text x="642" y="509" font-size="10.5" fill="#475569">sends the import_id — the graph is untouched</text>
  <text x="642" y="525" font-size="10.5" fill="#475569">until this exact click</text>

  <circle cx="602" cy="606" r="13" fill="#334155"/><text x="602" y="610" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="628" y="564" width="440" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="642" y="585"><tspan fill="#059669" font-size="9.5" font-weight="700">DATA · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Guarded insert</tspan></text>
  <text x="642" y="605" font-size="10.5" fill="#475569">rows land with origin = csv, status = pending;</text>
  <text x="642" y="621" font-size="10.5" fill="#475569">the ledger makes retries idempotent — no dupes</text>

  <circle cx="602" cy="702" r="13" fill="#334155"/><text x="602" y="706" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="628" y="660" width="440" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="642" y="681"><tspan fill="#059669" font-size="9.5" font-weight="700">DATA · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">One audit entry</tspan></text>
  <text x="642" y="701" font-size="10.5" fill="#475569">activity_log records who imported what, when —</text>
  <text x="642" y="717" font-size="10.5" fill="#475569">one line, full counts</text>

  <rect x="596" y="858" width="468" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="612" y="884" font-size="11" font-weight="700" fill="#0f172a">→ Visible result</text>
  <text x="612" y="902" font-size="10.5" fill="#475569">review queue now holds N + M items —</text>
  <text x="612" y="918" font-size="10.5" fill="#475569">nothing entered the graph as approved</text>

  <!-- ================= COLUMN 3 ================= -->
  <rect x="1112" y="130" width="508" height="860" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1132" y="160" font-size="15" font-weight="700" fill="#0f172a">③ Approve an edge</text>
  <text x="1112" y="178" font-size="11" fill="#64748b">the review queue — where trust gets assigned</text>

  <line x1="1138" y1="222" x2="1138" y2="689" stroke="#cbd5e1" stroke-width="2"/>

  <circle cx="1138" cy="222" r="13" fill="#334155"/><text x="1138" y="226" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="1164" y="180" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="1178" y="201"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Review queue: click ✓</tspan></text>
  <text x="1178" y="221" font-size="10.5" fill="#475569">the queue lists every pending item with its</text>
  <text x="1178" y="237" font-size="10.5" fill="#475569">origin badge — csv, graph-json, sim-ai, manual</text>

  <circle cx="1138" cy="318" r="13" fill="#334155"/><text x="1138" y="322" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="1164" y="276" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="1178" y="297"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">POST /api/edges/[id]/review</tspan></text>
  <text x="1178" y="317" font-size="10.5" fill="#475569">your actor id and the decision (approve / reject)</text>
  <text x="1178" y="333" font-size="10.5" fill="#475569">travel with the click</text>

  <circle cx="1138" cy="414" r="13" fill="#334155"/><text x="1138" y="418" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="1164" y="372" width="440" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="1178" y="393"><tspan fill="#2563eb" font-size="9.5" font-weight="700">API · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Validate + authorize</tspan></text>
  <text x="1178" y="413" font-size="10.5" fill="#475569">zod checks the decision payload;</text>
  <text x="1178" y="429" font-size="10.5" fill="#475569">viewer → 403, analyst and admin proceed</text>

  <circle cx="1138" cy="510" r="13" fill="#334155"/><text x="1138" y="514" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="1164" y="468" width="440" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="1178" y="489"><tspan fill="#d97706" font-size="9.5" font-weight="700">DOMAIN · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">State machine rules</tspan></text>
  <text x="1178" y="509" font-size="10.5" fill="#475569">pending → approved is a legal move;</text>
  <text x="1178" y="525" font-size="10.5" fill="#475569">retired → approved is not — illegal moves are refused</text>

  <circle cx="1138" cy="606" r="13" fill="#334155"/><text x="1138" y="610" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="1164" y="564" width="440" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="1178" y="585"><tspan fill="#059669" font-size="9.5" font-weight="700">DATA · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">UPDATE + full audit diff</tspan></text>
  <text x="1178" y="605" font-size="10.5" fill="#475569">edges gets status, decided_by, decided_at;</text>
  <text x="1178" y="621" font-size="10.5" fill="#475569">activity_log stores the BEFORE and AFTER states</text>

  <circle cx="1138" cy="702" r="13" fill="#334155"/><text x="1138" y="706" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="1164" y="660" width="440" height="84" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="1178" y="681"><tspan fill="#334155" font-size="9.5" font-weight="700">BROWSER · </tspan><tspan fill="#0f172a" font-size="11.5" font-weight="700">Canvas re-renders</tspan></text>
  <text x="1178" y="701" font-size="10.5" fill="#475569">the dashed line turns solid; the Health panel</text>
  <text x="1178" y="717" font-size="10.5" fill="#475569">and report counts move with it</text>

  <rect x="1132" y="858" width="468" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="1148" y="884" font-size="11" font-weight="700" fill="#0f172a">→ Visible result</text>
  <text x="1148" y="902" font-size="10.5" fill="#475569">the edge is trusted graph knowledge now —</text>
  <text x="1148" y="918" font-size="10.5" fill="#475569">and who decided, when, is permanent in the log</text>

  <!-- footer -->
  <text x="60" y="1030" font-size="12" font-weight="600" fill="#334155">Every action walks the same path: UI → validate → authorize → domain rule → database + audit log.</text>
  <text x="60" y="1050" font-size="11" fill="#64748b">The activity_log trail is what lets the export endpoint reconstruct the full history later · colors match docs/architecture.svg layers</text>
</svg>